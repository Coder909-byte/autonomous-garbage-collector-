<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188">
<title>HC-SR04 sensor wiring and voltage protection</title>
<rect width="1680" height="1188" fill="white"/>
<text x="42" y="46" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17232c">HC-SR04 sensor wiring and voltage protection</text>
<text x="42" y="76" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#17232c">Three independent dividers are REQUIRED and currently missing. Real ECHO remains disconnected until measured compatibility is established.</text>
<rect x="42" y="90" width="1596" height="34" fill="#fff2d8" stroke="#ad6a00" stroke-width="1.4"/>
<text x="53" y="113" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#17232c">E1 DESIGN HOLD | Physical connections unapproved | Generic ports require actual-part mapping | 02 Nov 2026</text>
<text x="42" y="1141" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Red +supply | Black GND | Blue control | Green sensor | Orange motor | Thick = high-current | Dashed = missing/blocked</text>
<text x="42" y="1166" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Net labels join across sheets. Crossings alone do not join. No component footprint / connector orientation is implied.</text>
<rect x="45" y="190" width="370" height="180" fill="#f4f7fb" stroke="#576572" stroke-width="1.4"/>
<text x="57" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">ESP1 / US_F</text>
<text x="57" y="239" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">GPIO32 TRIG 0/3.3V</text>
<text x="57" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">GPIO34 ECHO input ONLY</text>
<text x="57" y="281" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">No raw 5V input permitted</text>
<text x="57" y="302" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">GND = common logic return</text>
