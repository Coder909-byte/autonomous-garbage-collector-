<text x="55" y="910" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17232c">5V/VIN: only V5_MCU after OV1 and actual-board qualification. 3V3: E-stop dry feedback + U2 only. GND: logic return to BUCK1 OUT-.</text>
<text x="55" y="935" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17232c">Never feed 5V into a GPIO or 3V3 pin.</text>
<text x="55" y="985" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17232c">Unused: GPIO26, GPIO39/VN, GPIO4. Reserve GPIO1/3 for serial, GPIO0/2/5/12/15 boot straps, GPIO6-11 flash. Keep EN/reset under onboard</text>
<text x="55" y="1010" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#17232c">control; no JTAG on GPIO13/14. ESP32-CAM remains disconnected.</text>
