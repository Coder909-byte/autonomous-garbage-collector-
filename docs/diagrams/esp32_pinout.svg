<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188">
<title>ESP32 pinout connection chart</title>
<rect width="1680" height="1188" fill="white"/>
<text x="42" y="46" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17232c">ESP32 pinout connection chart</text>
<text x="42" y="76" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#17232c">Functional GPIO labels only. Exact DevKit header positions/USB power path remain unverified; no wiring orientation implied.</text>
<rect x="42" y="90" width="1596" height="34" fill="#fff2d8" stroke="#ad6a00" stroke-width="1.4"/>
<text x="53" y="113" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#17232c">E2 DESIGN HOLD | Physical connections unapproved | Generic ports require actual-part mapping | 08 Nov 2026</text>
<text x="42" y="1141" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Red +supply | Black GND | Blue control | Green sensor | Orange motor | Thick = high-current | Dashed = missing/blocked</text>
<text x="42" y="1166" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Net labels join across sheets. Crossings alone do not join. No component footprint / connector orientation is implied.</text>
<text x="55" y="162" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">GPIO / terminal</text>
<text x="275" y="162" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">Firmware signal</text>
<text x="535" y="162" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">Exact proposed endpoint chain</text>
<text x="1260" y="162" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">Electrical status / requirement</text>
