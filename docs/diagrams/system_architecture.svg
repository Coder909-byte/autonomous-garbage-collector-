<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188">
<title>Rover full-system architecture / S1</title>
<rect width="1680" height="1188" fill="white"/>
<text x="42" y="46" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17232c">Rover full-system architecture / S1</text>
<text x="42" y="76" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#17232c">Control and video are independent. E2 electrical package remains authoritative for W001-W201; camera additions W202-W211.</text>
<rect x="42" y="90" width="1596" height="34" fill="#fff2d8" stroke="#ad6a00" stroke-width="1.4"/>
<text x="53" y="113" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#17232c">S1 DESIGN HOLD | Physical connections unapproved | Generic ports require actual-part mapping | 10 Nov 2026</text>
<text x="42" y="1141" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Red +supply | Black GND | Blue control | Green sensor | Orange motor | Thick = high-current | Dashed = missing/blocked</text>
<text x="42" y="1166" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Net labels join across sheets. Crossings alone do not join. No component footprint / connector orientation is implied.</text>
<rect x="65" y="165" width="425" height="140" fill="#f4f7fb" stroke="#576572" stroke-width="1.4"/>
<text x="77" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">LAPTOP / local operator</text>
<text x="77" y="214" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">React / TypeScript dashboard</text>
<text x="77" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Loopback Node bridge; one serial owner</text>
<text x="77" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">No automatic ARM or restart</text>
<rect x="620" y="165" width="455" height="140" fill="#f4f7fb" stroke="#576572" stroke-width="1.4"/>
<text x="632" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">ESP1 / main ESP32</text>
<text x="632" y="214" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">USB serial 115200 baud</text>
<text x="632" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Motor / sensor / safety authority</text>
<text x="632" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">16 E2 GPIO assignments unchanged</text>
<polyline points="490,225 620,225" fill="none" stroke="#1565c0" stroke-width="3"/>
<text x="505" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#17232c">USB data</text>
<rect x="1200" y="165" width="420" height="140" fill="#fff9ed" stroke="#576572" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="1212" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">CAM1 / separate ESP32-CAM</text>
<text x="1212" y="214" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Supported AI-Thinker config only</text>
<text x="1212" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Actual module identity PENDING</text>
<text x="1212" y="256" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">MJPEG :81 / HTTP status :80</text>
<polyline points="280,165 280,145 1410,145 1410,165" fill="none" stroke="#23844b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="620" y="137" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#17232c">Trusted local Wi-Fi: camera video / snapshots only</text>
<rect x="65" y="385" width="425" height="175" fill="#fff9ed" stroke="#576572" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="77" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">POWER / existing E2</text>
<text x="77" y="434" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">BT1 -&gt; F0 -&gt; S0 -&gt; P1 -&gt; TB_POS</text>
<text x="77" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">F1 / BUCK1 / OV1 -&gt; ESP1</text>
<text x="77" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">F2 / BUCK2 / OV2 -&gt; logic + sensors</text>
<text x="77" y="497" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Dedicated star returns -&gt; TB_GND</text>
<rect x="620" y="385" width="455" height="175" fill="#fff9ed" stroke="#576572" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="632" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">CONTROL / E2 interfaces</text>
<text x="632" y="434" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">U1 AHCT: PWM + TRIG + gated EN</text>
<text x="632" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">U2 LVC: three protected ECHO inputs</text>
<text x="632" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">3 x HC-SR04: front / left / right</text>
<text x="632" y="497" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">GPIO27: active-HIGH healthy feedback</text>
<rect x="1200" y="385" width="420" height="175" fill="#fff9ed" stroke="#576572" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="1212" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">NEW camera power branch</text>
<text x="1212" y="434" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">TB_POS -&gt; F3 -&gt; BUCK3 -&gt; OV3</text>
<text x="1212" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Protected regulated 5V -&gt; CAM1</text>
<text x="1212" y="476" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Separate return; C_CAM bypass</text>
<text x="1212" y="497" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">W202-W211; current/thermal HOLD</text>
<polyline points="490,465 620,465" fill="none" stroke="#c62828" stroke-width="3"/>
<polyline points="845,305 845,385" fill="none" stroke="#1565c0" stroke-width="2"/>
<polyline points="490,545 550,545 550,600 1410,600 1410,560" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="8 5"/>
<polyline points="1410,385 1410,305" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="8 5"/>
<rect x="65" y="680" width="425" height="180" fill="#fff9ed" stroke="#576572" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="77" y="705" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">INDEPENDENT PHYSICAL STOP</text>
<text x="77" y="729" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">S2: 3 isolated NC contacts</text>
<text x="77" y="750" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">OV1/OV2 -&gt; coil permissives</text>
<text x="77" y="771" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">S3 hardware arm + K1 seal-in</text>
<text x="77" y="792" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">K1 opens motor bus; EN opens too</text>
<text x="77" y="813" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Software ESTOP does not open K1</text>
<rect x="620" y="680" width="455" height="180" fill="#fff9ed" stroke="#576572" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="632" y="705" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">DRIVERS / motor branch</text>
<text x="632" y="729" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">K1 -&gt; FL / FR / FA</text>
<text x="632" y="750" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">2 x BTS7960 -&gt; M1-M4 wheels</text>
<text x="632" y="771" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">1 x conditional L298N -&gt; M5/M6/M7</text>
<text x="632" y="792" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">FM1-FM7 per motor; grounds E2</text>
<text x="632" y="813" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">No driver load approval</text>
<rect x="1200" y="680" width="420" height="180" fill="#f4f7fb" stroke="#576572" stroke-width="1.4"/>
<text x="1212" y="705" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17232c">SAFETY / commissioning</text>
<text x="1212" y="729" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Startup DISARMED, EN low</text>
<text x="1212" y="750" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">1200ms firmware manual timeout</text>
<text x="1212" y="771" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Browser lease 300ms; release = S</text>
<text x="1212" y="792" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Actual USB supply isolation HOLD</text>
<text x="1212" y="813" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Physical verification NOT performed</text>
<polyline points="845,560 845,680" fill="none" stroke="#1565c0" stroke-width="3"/>
<polyline points="490,765 620,765" fill="none" stroke="#c62828" stroke-width="4"/>
<text x="65" y="945" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Grounds: retain E2 star architecture and dedicated motor returns. Camera return routes via BUCK3 to TB_GND, never through ESP1 or laptop. Do not parallel any positive regulator output.</text>
<text x="65" y="969" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">Camera power stays independent of K1 and cannot energize a motor output.</text>
<text x="65" y="1030" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">All blocks with dashed borders remain hardware HOLD. Generic ports are functions awaiting actual part selection, not manufacturer terminal numbers. Existing E2 sheets retain all</text>
<text x="65" y="1054" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#17232c">resistor, fuse, motor and control-wire detail; the next sheet contains every new camera connection.</text>
</svg>
