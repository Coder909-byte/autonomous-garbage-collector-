[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror -Itest/stubs
test_ignore =
    test_bench
    test_motor_operation

[env:usb_bench_diagnostic]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DROVER_OPERATING_MODE=USB_BENCH_DIAGNOSTIC

[env:native_bench]
extends = env:native
build_flags = ${env:native.build_flags} -DROVER_OPERATING_MODE=USB_BENCH_DIAGNOSTIC
test_ignore =
test_filter = test_bench

[env:motor_operation]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DROVER_OPERATING_MODE=MOTOR_OPERATION

[env:native_motor_operation]
extends = env:native
build_flags = ${env:native.build_flags} -DROVER_OPERATING_MODE=MOTOR_OPERATION
test_ignore =
test_filter = test_motor_operation

[env:native_motor_qualified_test]
extends = env:native_motor_operation
build_flags = ${env:native_motor_operation.build_flags} -DROVER_COMMISSIONING_TEST_FIXTURE

[env:motor_bench_release]
extends = env:motor_operation
build_flags = ${env:motor_operation.build_flags} -DROVER_BENCH_RELEASE -DROVER_BENCH_RECORD=\"SUPERVISED-BENCH-TEST_wheels-off-ground_fused-supply_manual-disconnect\"

[env:motor_bench_release_wifi]
extends = env:motor_bench_release
build_flags = ${env:motor_bench_release.build_flags} -DROVER_WIFI
lib_ldf_mode = chain+

[env:native_motor_bench_release]
extends = env:native_motor_operation
build_flags = ${env:native_motor_operation.build_flags} -DROVER_BENCH_RELEASE -DROVER_BENCH_RECORD=\"SUPERVISED-BENCH-TEST_wheels-off-ground_fused-supply_manual-disconnect\"

[env:wokwi_compile]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DROVER_WOKWI_SKETCH
