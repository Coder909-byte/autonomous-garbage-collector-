[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror -Itest/stubs

[env:wokwi_compile]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DROVER_WOKWI_SKETCH
